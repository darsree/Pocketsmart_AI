<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - PocketSmart</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="auth">
  <div class="auth-wrap">
    <div class="auth-brand">
      <h1>PocketSmart</h1>
      <p>AI-Powered Budget Planning</p>
    </div>
    <div class="auth-card">
      <h2>Reset Password</h2>
      <div id="msg" class="alert" hidden></div>
      <form id="resetForm" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-icon"><i class="fa-solid fa-user"></i>
            <input type="text" id="username" placeholder="Your username" autocomplete="username" required></div>
        </div>
        <div class="form-group">
          <label for="email">Registered Email</label>
          <div class="input-icon"><i class="fa-solid fa-envelope"></i>
            <input type="email" id="email" placeholder="Email used to register" autocomplete="email" required></div>
        </div>
        <div class="form-group">
          <label for="password">New Password</label>
          <div class="input-icon"><i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="At least 6 characters" autocomplete="new-password" maxlength="72" required></div>
        </div>
        <div class="form-group">
          <label for="confirm">Confirm New Password</label>
          <div class="input-icon"><i class="fa-solid fa-circle-check"></i>
            <input type="password" id="confirm" placeholder="Repeat the new password" autocomplete="new-password" maxlength="72" required></div>
        </div>
        <button type="submit" class="btn btn-block" id="submitBtn"><span id="btnText">Reset Password</span> <i class="fa-solid fa-key"></i></button>
      </form>
      <p class="auth-foot">Remembered it? <a href="/login">Sign In</a></p>
    </div>
  </div>
<script>
const msg = document.getElementById('msg');
function show(type, text) { msg.className = 'alert alert-' + type; msg.textContent = text; msg.hidden = false; }
function errMsg(d) {
  if (d && typeof d.detail === 'string') return d.detail;
  if (d && Array.isArray(d.detail) && d.detail.length) {
    return d.detail.map(e => {
      const f = (e.loc || []).slice(-1)[0];
      return (f && f !== 'body' ? String(f).replace(/_/g, ' ') + ': ' : '') + String(e.msg || '').replace(/^Value error, /, '');
    }).join(' | ');
  }
  return 'Could not reset the password. Please try again.';
}
document.getElementById('resetForm').addEventListener('submit', async e => {
  e.preventDefault();
  const payload = {
    username: document.getElementById('username').value.trim(),
    email: document.getElementById('email').value.trim(),
    new_password: document.getElementById('password').value,
    confirm_password: document.getElementById('confirm').value
  };
  if (!payload.username || !payload.email || !payload.new_password) return show('error', 'Please fill in all fields.');
  if (payload.new_password !== payload.confirm_password) return show('error', 'Passwords do not match.');
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  document.getElementById('btnText').textContent = 'Resetting...';
  try {
    const res = await fetch('/reset-password', {method: 'POST', credentials: 'same-origin',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)});
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(errMsg(data));
    show('success', 'Password updated! Redirecting to sign in...');
    setTimeout(() => location.href = '/login?reset=1', 1000);
  } catch (err) {
    show('error', err.message);
    btn.disabled = false;
    document.getElementById('btnText').textContent = 'Reset Password';
  }
});
</script>
</body>
</html>
