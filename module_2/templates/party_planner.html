<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Party Budget Planner - PocketSmart</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="/dashboard" class="brand"><i class="fa-solid fa-folder"></i> PocketSmart</a>
      <div class="nav-links">
        <a href="/home-planner"><i class="fa-solid fa-house"></i> Home Planner</a>
        <a href="/party-planner" class="active"><i class="fa-solid fa-champagne-glasses"></i> Party Planner</a>
        <a href="/jewelry-planner"><i class="fa-solid fa-gem"></i> Jewelry Planner</a>
        <a href="/history"><i class="fa-solid fa-clock-rotate-left"></i> History</a>
        <a href="/logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
      </div>
    </div>
  </nav>

  <main>
    <section class="page-hero">
      <h1>Party Budget Planner</h1>
      <p>Plan your perfect event with AI-powered budget recommendations</p>
    </section>

    <div class="planner-main">
      <div class="planner-card">
        <div id="error" class="alert alert-error" hidden></div>
        <form id="partyForm" novalidate>
          <div class="form-section">
            <div class="section-head"><span class="ico"><i class="fa-solid fa-indian-rupee-sign"></i></span> Basic Information</div>
            <div class="grid-2">
              <div class="field"><label for="total_budget">Total Budget (&#8377;)</label>
                <div class="input-icon"><i class="fa-solid fa-money-bill-wave"></i><input type="number" id="total_budget" min="1" step="any" placeholder="e.g. 30000" required></div></div>
              <div class="field"><label for="num_guests">Number of Guests</label>
                <div class="input-icon"><i class="fa-solid fa-users"></i><input type="number" id="num_guests" min="1" max="10000" placeholder="e.g. 25" required></div></div>
            </div>
          </div>

          <div class="form-section">
            <div class="section-head"><span class="ico"><i class="fa-solid fa-champagne-glasses"></i></span> Event Details</div>
            <div class="grid-2">
              <div class="field"><label for="party_type">Party Type</label>
                <div class="input-icon"><i class="fa-solid fa-cake-candles"></i><input type="text" id="party_type" list="partyTypes" maxlength="50" placeholder="e.g. Birthday, Wedding" required></div>
                <datalist id="partyTypes"><option value="Birthday"><option value="Wedding"><option value="Anniversary"><option value="Baby Shower"><option value="Housewarming"><option value="Farewell"><option value="Corporate Event"></datalist></div>
              <div class="field"><label for="venue_type">Venue Type</label>
                <div class="input-icon"><i class="fa-solid fa-location-dot"></i><input type="text" id="venue_type" list="venueTypes" maxlength="60" placeholder="e.g. Home, Banquet Hall"></div>
                <datalist id="venueTypes"><option value="Home"><option value="Banquet Hall"><option value="Restaurant"><option value="Garden / Outdoor"><option value="Community Hall"><option value="Resort"></datalist></div>
            </div>
          </div>

          <div class="form-section">
            <div class="section-head"><span class="ico"><i class="fa-solid fa-list-check"></i></span> Party Needs</div>
            <div class="need-grid">
              <label class="need"><input type="checkbox" id="needs_catering" checked><span class="circ"><i class="fa-solid fa-utensils"></i></span> Catering</label>
              <label class="need"><input type="checkbox" id="needs_decoration" checked><span class="circ"><i class="fa-solid fa-palette"></i></span> Decoration</label>
              <label class="need"><input type="checkbox" id="needs_entertainment" checked><span class="circ"><i class="fa-solid fa-music"></i></span> Entertainment</label>
            </div>
          </div>

          <div class="form-section">
            <div class="section-head"><span class="ico"><i class="fa-solid fa-comment-dots"></i></span> Additional Requirements</div>
            <textarea id="additional_requirements" rows="3" maxlength="1000" placeholder="Special requests, themes, dietary restrictions, etc."></textarea>
          </div>

          <button type="submit" class="btn btn-block" id="submitBtn" style="border-radius:8px"><i class="fa-solid fa-calculator" id="btnIcon"></i> <span id="btnText">Generate Budget Plan</span></button>
        </form>
      </div>

      <section class="results" id="results" hidden></section>
    </div>
  </main>

  <footer class="footer-simple">&copy; 2026 PocketSmart. All rights reserved.</footer>

<script>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c])
);

const inr = n =>
    '\u20B9' + Number(n || 0).toLocaleString('en-IN', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });

const pretty = s =>
    String(s || 'Other')
        .replace(/[_-]+/g, ' ')
        .replace(/\b\w/g, c => c.toUpperCase());

const SHOP = {
    amazon: 'Amazon',
    flipkart: 'Flipkart',
    ikea: 'IKEA',
    myntra: 'Myntra',
    ajio: 'Ajio',
    meesho: 'Meesho',
    bigbasket: 'BigBasket',
    swiggy: 'Swiggy',
    zomato: 'Zomato',
    bookmyshow: 'BookMyShow',
    google: 'Google',
    booking: 'Booking',
    makemytrip: 'MakeMyTrip',
    oyorooms: 'OYO',
    nobroker: 'NoBroker',
    justdial: 'Justdial',
    sulekha: 'Sulekha',
    wedmegood: 'WedMeGood'
};

function links(obj) {
    return Object.entries(obj || {})
        .filter(([, u]) => /^https?:\/\//.test(u))
        .map(([k, u]) =>
            `<a class="shop-link" href="${esc(u)}" target="_blank" rel="noopener noreferrer">
                <i class="fa-solid fa-arrow-up-right-from-square"></i>
                ${esc(SHOP[k] || pretty(k))}
            </a>`
        )
        .join('');
}

const budgetError = v =>
    Number.isNaN(v)
        ? 'Please enter your total budget.'
        : v < 0
        ? 'Budget cannot be negative. Please enter an amount greater than 0.'
        : v === 0
        ? 'Budget cannot be zero. Please enter an amount greater than 0.'
        : !Number.isFinite(v)
        ? 'Please enter a valid budget amount.'
        : '';

function errMsg(d, fallback) {

    if (d && typeof d.detail === 'string')
        return d.detail;

    if (d && Array.isArray(d.detail) && d.detail.length) {

        return d.detail.map(e => {

            const f = (e.loc || []).slice(-1)[0];
            const m = String(e.msg || '').replace(/^Value error, /, '');

            return (f && f !== 'body' ? pretty(f) + ': ' : '') + m;

        }).join(' | ');
    }

    return fallback;
}

const CAT_ICON = {
    venue: 'fa-location-dot',
    catering: 'fa-utensils',
    food: 'fa-utensils',
    drinks: 'fa-martini-glass',
    decoration: 'fa-palette',
    entertainment: 'fa-music',
    gifts: 'fa-gift',
    return_gifts: 'fa-gift',
    photography: 'fa-camera',
    music: 'fa-music',
    games: 'fa-dice',
    transportation: 'fa-car',
    contingency: 'fa-tag'
};

function render(d) {

    const rem = Number(d.remaining_budget || 0);

    let h = `
        <div class="res-card">
            <div class="res-body">

                <div class="party-head">
                    <h2>Your Party Budget Plan</h2>

                    <button class="btn btn-blue no-print" onclick="window.print()">
                        <i class="fa-solid fa-print" style="color:#fff"></i>
                        Print/Save
                    </button>
                </div>

                <div class="party-total">
                    Budget: ${inr(d.total_budget)}
                </div>
    `;

    if (d.notice) {
        h += `
            <div class="alert alert-info">
                <i class="fa-solid fa-circle-info"></i>
                ${esc(d.notice)}
            </div>
        `;
    }

    if (d.budget_warning) {
        h += `
            <div class="alert alert-warn">
                <i class="fa-solid fa-triangle-exclamation"></i>
                ${esc(d.budget_warning)}
            </div>
        `;
    }

    (d.budget_breakdown || []).forEach(c => {

        const key = String(c.category || '')
            .toLowerCase()
            .replace(/\s+/g, '_');

        const total = (c.items || []).reduce(
            (a, i) =>
                a +
                Number(i.estimated_price || 0) *
                Number(i.quantity || 1),
            0
        );

        h += `
            <div class="cat-box">
                <div class="cat-box-head">
                    <span>
                        <i class="ico fa-solid ${CAT_ICON[key] || 'fa-tag'}"></i>
                        ${esc(pretty(c.category))}
                    </span>

                    <span>${inr(total)}</span>
                </div>
        `;

        (c.items || []).forEach(i => {

            const line =
                Number(i.estimated_price || 0) *
                Number(i.quantity || 1);

            h += `
                <div class="item-box">

                    <div class="item-top">
                        <span>
                            ${esc(i.name)}
                            ${Number(i.quantity) > 1
                                ? ' (x' + esc(i.quantity) + ')'
                                : ''}
                        </span>

                        <span>${inr(line)}</span>
                    </div>

                    <div class="item-desc">
                        ${esc(i.description)}
                    </div>

                    <div>
                        Shop on: ${links(i.shopping_links)}
                    </div>

                </div>
            `;
        });

        h += '</div>';
    });

    h += `
        <div class="totals">

            <div class="tb">
                <span>Total Budget</span>
                <span>${inr(d.total_budget)}</span>
            </div>

            <div>
                <span>Allocated</span>
                <span>${inr(d.total_spent)}</span>
            </div>

            <div>
                <span>Remaining</span>
                <span class="${rem < 0 ? 'neg' : ''}">
                    ${inr(rem)}
                </span>
            </div>

        </div>
    `;

    const venues = d.venue_suggestions || [];

    if (venues.length) {

        h += `
            <div class="sub-title">
                <i class="fa-solid fa-location-dot"></i>
                Venue Suggestions
            </div>
        `;

        venues.forEach(v => {

            h += `
                <div class="venue-card">

                    <h4>
                        <span>${esc(v.name)}</span>
                        <span>${inr(v.estimated_cost)}</span>
                    </h4>

                    ${v.type
                        ? `<p>
                            <i class="fa-solid fa-tag"></i>
                            Type: ${esc(v.type)}
                           </p>`
                        : ''}

                    ${v.capacity
                        ? `<p>
                            <i class="fa-solid fa-users"></i>
                            Capacity: ${esc(v.capacity)} guests
                           </p>`
                        : ''}

                    ${v.location
                        ? `<p>
                            <i class="fa-solid fa-map"></i>
                            Location: ${esc(v.location)}
                           </p>`
                        : ''}

                    <p>${links(v.search_links)}</p>

                </div>
            `;
        });
    }

    const tips = d.additional_suggestions || [];

    if (tips.length) {

        h += `
            <div class="sub-title">
                <i class="fa-solid fa-lightbulb"></i>
                Additional Suggestions
            </div>

            <div class="sugg-box">
                <ul class="dot-list">
                    ${tips.map(t => `<li>${esc(t)}</li>`).join('')}
                </ul>
            </div>
        `;
    }

    h += '</div></div>';

    const box = document.getElementById('results');

    box.innerHTML = h;
    box.hidden = false;

    box.scrollIntoView({
        behavior: 'smooth',
        block: 'start'
    });
}

const errBox = document.getElementById('error');

function fail(text) {
    errBox.textContent = text;
    errBox.hidden = false;
}

document.getElementById('partyForm').addEventListener('submit', async e => {

    e.preventDefault();

    errBox.hidden = true;

    const payload = {

        total_budget:
            parseFloat(
                document.getElementById('total_budget').value
            ),

        party_type:
            document.getElementById('party_type').value.trim(),

        num_guests:
            parseInt(
                document.getElementById('num_guests').value,
                10
            ),

        venue_type:
            document.getElementById('venue_type').value.trim() || null,

        needs_catering:
            document.getElementById('needs_catering').checked,

        needs_decoration:
            document.getElementById('needs_decoration').checked,

        needs_entertainment:
            document.getElementById('needs_entertainment').checked,

        additional_requirements:
            document.getElementById('additional_requirements')
                .value.trim() || null
    };

    const bErr = budgetError(payload.total_budget);

    if (bErr)
        return fail(bErr);

    if (!(payload.num_guests >= 1))
        return fail('Please enter the number of guests.');

    if (payload.party_type.length < 2)
        return fail(
            'Please enter the party type (for example Birthday).'
        );

    const btn = document.getElementById('submitBtn');

    btn.disabled = true;

    document.getElementById('btnIcon').className = 'spinner';

    document.getElementById('btnText').textContent =
        'Generating... this can take a few seconds';

    try {

        const res = await fetch('/party-budget', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        });

        if (res.status === 401) {
            location.href = '/login';
            return;
        }

        const data = await res.json().catch(() => ({}));

        if (!res.ok)
            throw new Error(
                errMsg(
                    data,
                    'Could not generate the plan. Please try again.'
                )
            );

        render(data);

    } catch (err) {

        fail(err.message);

    } finally {

        btn.disabled = false;

        document.getElementById('btnIcon').className =
            'fa-solid fa-calculator';

        document.getElementById('btnText').textContent =
            'Generate Budget Plan';
    }
});

</script>
</body>
</html>
